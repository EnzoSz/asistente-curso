[project]
name = "practica-m3-clase-04-backend"
version = "0.1.0"
description = "Backend de la Clase 4 del Módulo 3: el asistente del curso en producción (Render), con su v2 y la optimización continua."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.164.0",
    "langchain>=1.5.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.15.0",
    "numpy>=2.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    # En Windows, algunos servidores colorean sus mensajes con colorama.
    "colorama>=0.4.6; sys_platform == 'win32'",
    "langchain-anthropic>=1.7.12",
    "langchain-google-genai>=4.5.2",
]

# Para el despliegue: los paquetes de este proyecto (el resto son scripts).
[tool.setuptools]
packages = ["asistente", "asistente.utils", "api"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.40",
]
